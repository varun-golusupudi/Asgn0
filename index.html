<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Draw a blue rectangle (canvas version)</title>
    </head>
    <body onload="main()">
        <canvas id="example" width="400" height="400">
            Please use a browser that supports "canvas"
        </canvas><br>

        <label for="x">v1:x</label>
        <input type="text" id="x">
        <label for="y">y</label>
        <input type="text" id="y"><br>

        <label for="x">v2:x</label>
        <input type="text" id="x2">
        <label for="y">y</label>
        <input type="text" id="y2"><br>
        <input id="drawButton" type="submit" value="Draw"><br><br>
        
        <label for="operation">Operation:</label>
        <select id="operation" name="operation">
            <option value="add">Add</option>
            <option value="sub">Subtract</option>
            <option value="mul">Multiply</option>
            <option value="div">Divide</option>
            <option value="magnitude">Magnitude</option>
            <option value="normalize">Normalize</option>
            <option value="angleBetween">Angle Between</option>
            <option value="area">Area</option>

        </select>
        <label for="scalar">Scalar:</label>
        <input type="text" id="scalar"><br>
        <input id="drawButton2" type="submit" value="Draw2">

        <script src="asgn0.js"></script>
        <script src="./lib/cuon-matrix-cse160.js"></script>
    </body>
</html>
